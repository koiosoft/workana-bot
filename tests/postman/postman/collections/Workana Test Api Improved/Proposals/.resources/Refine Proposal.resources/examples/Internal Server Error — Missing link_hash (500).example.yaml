$kind: http-example
request:
  url: "{{base_url}}/api/proposals/{{project_id}}/refine"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "llm_model_id": "deepseek/deepseek-v4-pro",
        "user_feedback_observations": "Please reduce the total budget to under $1,500 and focus only on the backend API. Remove all frontend milestones."
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  body:
    type: text
    content: |-
      {
        "detail": {
          "error": "Internal Server Error",
          "message": "Project is missing link_hash; cannot store proposal version."
        }
      }
order: 4000
