# =============================================================================
# docker-compose.dev.yml  —  ENTORNO DE DESARROLLO (tu Mac)
# =============================================================================
#
# Uso en desarrollo:
#   docker compose -f docker-compose.dev.yml up -d
#
# IMPORTANTE: NO se usa `docker-compose.yml` como nombre por defecto (a
# proposito). Asi, un `docker compose up -d` sin `-f` FALLA en vez de levantar
# el entorno equivocado. El entorno lo eliges TU con `-f`:
#
#   docker-compose.dev.yml   -> desarrollo  (esta maquina; .env con values STAGE)
#   docker-compose.prod.yml  -> produccion  (servidor;    .env con values PROD)
#
# Este compose usa el archivo `.env` (vive SOLO en la maquina, no en git).
# En tu Mac, `.env` debe contener los valores de STAGE (token @stage_workana_bot,
# BD workana_bot_stage). En el servidor, `.env` contiene los de PROD.
# El MISMO nombre de archivo, distinto contenido por maquina.
# =============================================================================

services:
  bot:
    # Bot de Telegram (@stage_workana_bot en tu Mac). Hace polling.
    build: ./app
    container_name: workana_bot
    restart: always
    volumes:
      - ./app:/usr/src/app
      - ./browser_data:/usr/src/app/browser_data
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    # Mantiene el contenedor activo para desarrollo
    tty: true
    networks:
      - workana_network

  api:
    # API FastAPI. El frontend la consume como http://api:8000
    build: ./app
    container_name: workana_api
    restart: always
    working_dir: /usr/src
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./app:/usr/src/app
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - workana_network

  mongodb:
    image: mongo:8.0.4
    container_name: workana_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./data/db:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - workana_network

networks:
  workana_network:
    # Nombre FIJO y explicito (no depende del nombre de la carpeta del proyecto).
    # Mismo nombre que en prod, para consistencia.
    name: workana_net
    driver: bridge
