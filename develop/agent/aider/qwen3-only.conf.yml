# Modelo local que estás usando
model: openrouter/qwen/qwen3-32b
editor-edit-format: diff

read:
  - SPEC.md
  - CONVENTIONS.md

# Desactiva commits automáticos
auto-commits: false

# No muestres diffs al hacer commit (aunque auto-commits=false, no afecta)
show-diffs: false

# Reduce el mapa del repositorio para ahorrar contexto (ayuda a que el modelo no divague)
map-tokens: "1024"

# Atributos del commit (para que no aparezca "aider" en el autor)
attribute-author: false
attribute-committer: false
attribute-co-authored-by: false
attribute-commit-message-author: false
attribute-commit-message-committer: false
dirty-commits: false


# Reduce la verbosidad general
verbose: false
test-cmd: "pytest tests/unit --tb=short"