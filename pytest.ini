[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Requires pytest-dotenv plugin to be installed
env_files = .env.test
pythonpath = .
# Por defecto NUNCA se pega a la red: los tests contra el proveedor real
# estan marcados con @pytest.mark.live y se excluyen aqui. Para correrlos
# explicitamente:  pytest -m live
addopts = -m "not live"
markers =
    live: test que llama al proveedor LLM REAL (OpenRouter/Gemini). Lento y
        potencialmente flaky; excluido por defecto via addopts.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
