# dev-ui-worker workflow (compiled; apply/branch only).
workflow:
  name: dev-ui-worker-execution
  entry: phase_d1_preparation

constraints:
  - forbidden: run_tests
  - forbidden: run_git
  - forbidden: read_other_sdd_dirs
    unless: [this_role_file, code_inspect_tools, ui_tools]
  - forbidden: execute_source
    unless: [ui_parse]                    # bash agent-instructor tool ui-parse (SDD tooling)
  - guard: edit_file
    when: target_in_scope                # never outside task scope
  - guard: run_shell_tooling
    when: not (test_runner | entrypoint | runs_feature_code)

role:
  context_resets: true
  reader_only: false

phases:
  phase_d1_preparation:
    steps:
      - apply: read_context_file
        args: { path: ".sdd/core/SPEC.md" }
      - apply: read_context_file
        args: { path: ".sdd/core/CONVENTIONS.md" }
      - apply: read_context_file
        args: { path: ".sdd/compiled/tools/ui_tools.yaml" }
      - apply: bootstrap_mcp_tools
      - apply: retrieval_search

  phase_d2_receive_task:
    steps:
      - apply: read_task_file
        args: { task_file: "${LOG_DIR}/task-${i}.md" }

  phase_d2_execute_task:
    steps:
      - apply: retrieval_search
      - apply: ui_parse                  # AST parse of UI code when the task provides html/prototype
      - apply: edit_file
      - branch: phase_e2_blocked
      - branch: phase_d2_success
      - branch: phase_d2_failure

  phase_d2_success:
    steps:
      - apply: write_justification
        args:
          sections: [what_was_done, why_approaches_chosen, tradeoffs_or_technical_debt]
      - branch: final_report_completed

  phase_d2_failure:
    steps:
      - branch: final_report_error

  phase_e2_blocked:
    steps:
      - apply: report_status
        args: { status: blocked, question: "<concrete-doubt-or-missing-context>" }
      - branch: final_report_blocked

final_report_completed:
  - apply: report_status
    args: { status: completed, success: true, error_details: null, question: null }
final_report_blocked:
  - apply: report_status
    args: { status: blocked, success: false, error_details: null, question: "<concrete-doubt-or-missing-context>" }
final_report_error:
  - apply: report_status
    args: { status: error, success: false, error_details: "<human-readable-failure-explanation>", question: null }

output:
  task_file: "${LOG_DIR}/task-${i}.md"
