# Orchestrator suite-run module (deterministic): dispatch the test-runner agent for a suite & write log.
workflow:
  name: dev-orchestrator-mod-testing-run
  kind: orchestrator_module
  entry: run
  params: { mode, log_file_path }

phases:
  run:
    steps:
      - launch: "${test_runner_agent_name}"
        task: "Mode: ${mode}. Log file: ${log_file_path}. Run all ${mode} tests."
      - wait_result
      - branch: return_with          # structured payload to caller (LOOP)
        args: { success, failing_test_files, error_type }
