use_cases:

  read_sdd_instruction_frontmatter:
    steps:
      - command: read
        args: { path: ".sdd/instructions/${PROTOCOL}.md", within: frontmatter }

  read_task_list:
    steps:
      - command: read
        args: { path: ".sdd/instructions/${PROTOCOL}.md" }
      - command: extract_list
        args: { section: "## Task List", unchecked_only: true }

  read_test_list_of_mode:
    steps:
      - command: read
        args: { path: ".sdd/instructions/${PROTOCOL}.md" }
      - command: extract_list
        args: { section: "${TEST_MODE} Test List", unchecked_only: true }


  module_log_preparation:
    steps:
      - command: bash
        args: { command: "agent-instructor workflow open ${PROTOCOL}" }

  module_dev_coder_mark:
    steps:
      - command: bash
        args: { command: "agent-instructor workflow update --file <TASK_ID>.md --status completed" }

  module_testing_loop:
    steps:
      - command: bash
        args: { command: "agent-instructor workflow update --status completed <test-artifact> --mode ${TEST_MODE}" }

  workflow_review_list:
    steps:
      - command: bash
        args: { command: "agent-instructor workflow review list --json" }

  workflow_review_mark:
    steps:
      - command: bash
        args: { command: "agent-instructor workflow review mark --ack <ACK_ID> --status <approved|correction>" }

  module_finalization:
    steps:
      - command: bash
        args: { command: "agent-instructor workflow summary && agent-instructor workflow close" }

  module_finalization_summary:
    steps:
      - command: bash
        args: { command: "agent-instructor workflow summary [--json]" }

  module_finalization_close:
    steps:
      - command: bash
        args: { command: "agent-instructor workflow close" }

  workflow_judge_record_decision:
    steps:
      - command: bash
        args: { command: "agent-instructor workflow judge --task <TASK_ID> --issue \"${issue}\" --decision \"${directive}\"" }

  resolve_worker_model:
    steps:
      - command: read
        args: { path: ".sdd/compiled/models.yaml" }
      - command: pick_model_by_priority
        args: { role: "${picked_agent}-compiled", priority: 1 }
