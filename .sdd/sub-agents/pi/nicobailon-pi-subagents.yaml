# Harness surface to launch/steer sub-agents (pi-subagents). Replaceable: another harness
# re-implements these same use-cases. This file holds NO result schema — the canonical
# report_status schema lives once in .sdd/sub-agents/sub-agents-surface.yaml.
# Keys here are the names referenced by SDD protocol docs.

use_cases:
  # Launch a sub-agent in background. Base params: agent, task, async, model.
  # For canonical structured output, the caller may add:
  #   output_schema = report_status.output_schema  (defined in sub-agents-surface.yaml)
  #   acceptance    = { ... report:"on" }          (forces the plugin structured_output)
  # Without outputSchema the sub-agent returns its canonical JSON in text (legacy).
  launch: "subagent({ agent, task, async, model })"

  # Resume a blocked/paused run preserving context. Params: id, message.
  resume: "subagent({ action: \"resume\", id, message })"

  # Redirect a running worker. Params: id, message.
  steer: "subagent({ action: \"steer\", id, message })"

  # Read an async sub-agent result. Params: id.
  read_result: "subagent({ action: \"status\", id })"

  # Wait for an async to finish (timeoutMs from wait_timeout_ms) and read result. Params: id.
  wait_result: |
    subagent_wait({ id, timeoutMs: 240000 })
    subagent({ action: "status", id })

  # Check an in-flight async status. Params: id.
  check_status: "subagent({ action: \"status\", id })"

# Timeout (ms) used by wait_result.
wait_timeout_ms: 240000
