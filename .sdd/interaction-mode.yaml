# Interaction mode and gate delivery channels (see .sdd/sdd-lang.md section 2, gates).
#
# The channel NEVER changes gate semantics: a gate always blocks until an explicit answer
# (fail-closed, sdd-lang.md section 6.6). This file only declares HOW a gate is delivered and
# HOW the answer arrives.
#
# Like sub-agents/**/ports, this mapping is REPLACEABLE: adding a channel means adding one key.

# Active channel. Default: terminal (a cycle started without switching is in terminal mode).
mode: telegram

channels:
  # Native blocking prompt of the TUI. Answer arrives in the terminal.
  terminal:
    delivery: prompt
    blocking: true
    answer_source: tui

  # Telegram bridge. The gate is a message with buttons; the answer arrives as a user turn.
  telegram:
    delivery: telegram_message
    blocking: true
    answer_source: telegram
    note: the TUI prompt is not answerable from Telegram, so it must not be used in this mode

# Switch history (append-only). Each mode prompt records the transition it performed.
history:
  - { from: terminal, to: telegram, at: 2026-09-10T17:15:00Z }
  - { from: telegram, to: terminal, at: 2026-09-10T18:52:00Z }
  - { from: terminal, to: telegram, at: 2026-09-12T16:30:00Z }
  - { from: telegram, to: terminal, at: 2026-09-12T20:30:00Z }
  - { from: terminal, to: telegram, at: 2026-09-14T16:10:00Z }
  - { from: telegram, to: terminal, at: 2026-09-14T16:30:00Z }
  - { from: terminal, to: telegram, at: 2026-09-14T16:45:00Z }
